[package]
name = "widget-panel"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
description = "A liquid side panel for your screen edge: emoji, clipboard, colors, notes, apps and more."
license = "MIT"

[[bin]]
name = "widget-panel"
path = "src/main.rs"

[dependencies]
arboard = { version = "3.6.1", default-features = false }
serde_json = "1.0.151"
tao = "0.37.0"
wry = "0.57.0"
tray-icon = { version = "0.25.1", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_DataExchange", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_Shutdown", "Win32_System_Diagnostics_Debug", "Win32_UI_Shell", "Win32_UI_Controls_Dialogs", "Win32_UI_Controls", "Win32_System_Com", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_System_Ole", "Win32_UI_Shell_Common", "Win32_System_LibraryLoader"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true